name: Test and release alpha
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  popup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Select Rust
        run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked --manifest-path prototypes/popup/Cargo.toml
      - run: cargo build --release --locked --manifest-path prototypes/popup/Cargo.toml
      - run: prototypes/popup/target/release/boh-popup --self-test
      - name: Package and test clean installation
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/package-release.mjs
          cp prototypes/popup/target/release/boh-popup "release/boh-popup-$PLATFORM"
          node scripts/checksums.mjs release
          node scripts/smoke-install.mjs release
          node scripts/package-npm.mjs release release --platform-only
          node scripts/smoke-npm.mjs "release/bohselecta-$(node -p 'require("./package.json").version').tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: popup-${{ matrix.platform }}
          path: release/boh-popup-*
          if-no-files-found: error
  publish:
    needs: [test, popup]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if ("v"+require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - run: node scripts/package-release.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: popup-*
          path: release
          merge-multiple: true
      - run: npm ci --ignore-scripts
      - run: node scripts/package-npm.mjs release
      - run: node scripts/generate-homebrew.mjs "$(node -p 'require("./package.json").version')" release
      - run: node scripts/checksums.mjs release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "bohselecta $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
